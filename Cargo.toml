[workspace]
resolver = "2"
members = ["crates/*", "apps/clipcheckd"]
exclude = ["apps/ui"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
ulid = "1"
windows = "0.58"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
