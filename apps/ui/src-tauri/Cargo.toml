[package]
name = "clipcheck-ui"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "ClipCheck desktop UI (Tauri v2 shell)"
publish = false

# This crate is excluded from the root workspace (apps/ui is excluded in the root Cargo.toml),
# so it is its own workspace root.
[workspace]

[lib]
name = "clipcheck_ui_lib"
path = "src/lib.rs"

[[bin]]
name = "clipcheck-ui"
path = "src/main.rs"

[dependencies]
clipcheck-util = { path = "../../../crates/util" }
clipcheck-library = { path = "../../../crates/library" }
clipcheck-ipc = { path = "../../../crates/ipc" }
clipcheckd = { path = "../../clipcheckd" }
clipcheck-clipedit = { path = "../../../crates/clipedit" }
clipcheck-mp4 = { path = "../../../crates/mp4" }
clipcheck-mfdec = { path = "../../../crates/mfdec" }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tauri = { version = "2", features = [] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
clipcheck-testkit = { path = "../../../crates/testkit" }
tempfile = "3"

# Mirrors the root Cargo.toml [profile.release] (lto, codegen-units, strip, opt-level) so the shipped
# app is optimized the same way. panic stays "unwind" on purpose: this binary also hosts the recorder
# daemon (--daemon), where a panic in one worker thread must not take the whole recorder down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
