[package]
name = "clipcheck-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clipcheck-util = { path = "../util" }
clipcheck-core = { path = "../core" }
clipcheck-capture = { path = "../capture" }
clipcheck-encode = { path = "../encode" }
clipcheck-buffer = { path = "../buffer" }
clipcheck-session = { path = "../session" }
clipcheck-library = { path = "../library" }
clipcheck-audio = { path = "../audio" }
clipcheck-mp4 = { path = "../mp4" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }

[target.'cfg(windows)'.dependencies]
clipcheck-hwenc = { path = "../hwenc" }
clipcheck-mfdec = { path = "../mfdec" }
windows ={ workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[dev-dependencies]
clipcheck-testkit = { path = "../testkit" }
tempfile = { workspace = true }
